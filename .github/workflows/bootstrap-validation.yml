name: Bootstrap validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  planning-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate requirement coverage and planning artifacts
        run: python3 scripts/validate_plan.py
      - name: Validate deterministic chunk graph
        run: python3 scripts/reconcile_state.py --validate-plan
      - name: Verify reconciliation with isolated Git repositories
        run: python3 -m unittest discover -s tests/workflow -v
