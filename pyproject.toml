[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "zuno-edu"
version = "0.1.0"
description = "Zuno Edu modular API foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "sqlalchemy==2.0.54",
    "tzdata==2026.4",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.8",
    "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
required-version = "==0.12.3"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/zuno_edu"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["apps/api/src", "tests/chunks/ZE-P01-C01", "tests/chunks/ZE-P01-C02", "tests/chunks/ZE-P01-C03"]

[tool.pytest.ini_options]
testpaths = ["tests/chunks"]
addopts = "-ra --strict-markers --strict-config"
markers = ["migration: real PostgreSQL migration and schema compatibility checks"]
