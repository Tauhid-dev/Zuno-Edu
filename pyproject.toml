[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "zuno-edu"
version = "0.1.0"
description = "Zuno Edu modular API foundation"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "mypy==2.3.1", "pytest==9.1.1", "ruff==0.16.8"]

[tool.uv]
required-version = "==0.12.3"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/zuno_edu"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["apps/api/src", "tests/chunks/ZE-P01-C01"]

[tool.pytest.ini_options]
testpaths = ["tests/chunks"]
addopts = "-ra --strict-markers --strict-config"
